name: Build and Release WDTT Client

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Windows (только x86_64)
  # ============================================================
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build (Release)
        run: cargo build --release --target x86_64-pc-windows-msvc
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdtt-client-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/wdtt-rslib.exe

  # ============================================================
  # Linux (только x86_64)
  # ============================================================
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdtt-client-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/wdtt-rslib

  # ============================================================
  # macOS (Intel + Apple Silicon)
  # ============================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
            label: intel
          - arch: aarch64
            target: aarch64-apple-darwin
            label: apple-silicon
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdtt-client-macos-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/wdtt-rslib

  # ============================================================
  # Сборка всех артефактов в отдельные ZIP-архивы
  # ============================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate version tag
        id: version
        run: |
          TAG=$(date +'%Y.%m.%d.%H.%M')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=WDTT Client $TAG" >> $GITHUB_OUTPUT

      - name: Create individual ZIP archives
        run: |
          # Очищаем старые папки
          rm -rf release release_all
          mkdir -p release
          mkdir -p release_all
          
          # Проходим по всем артефактам
          for dir in artifacts/*; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              # Находим файл внутри папки (бинарник)
              file=$(find "$dir" -type f \( -name "wdtt-rslib*" -o -name "*.exe" \) | head -n 1)
              if [ -f "$file" ]; then
                # Определяем расширение для Windows
                if [[ "$name" == *"windows"* ]] || [[ "$file" == *.exe ]]; then
                  filename="wdtt-rslib.exe"
                else
                  filename="wdtt-rslib"
                fi
                # Копируем в папку release для индивидуального архива
                cp "$file" "release/$filename"
                cd release
                zip -r "../${name}.zip" "$filename"
                cd ..
                rm "release/$filename"
                
                # Копируем в папку release_all для общего архива
                if [[ "$name" == *"windows"* ]] || [[ "$file" == *.exe ]]; then
                  cp "$file" "release_all/${name}.exe"
                else
                  cp "$file" "release_all/${name}"
                fi
              fi
            fi
          done
          
          # Создаём общий архив со всеми бинарниками
          cd release_all
          zip -r ../wdtt-client-all-platforms.zip .
          tar -czf ../wdtt-client-all-platforms.tar.gz .
          cd ..

      - name: List all archives
        run: |
          echo "=== Созданные архивы ==="
          ls -la *.zip
          ls -la *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## WDTT Client Release
            
            **Date:** $(date +'%Y-%m-%d %H:%M:%S')
            
            ### Downloads
            - [📦 ZIP (All Platforms)](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-all-platforms.zip)
            - [📦 TAR.GZ (All Platforms)](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-all-platforms.tar.gz)
            
            ### Individual Downloads
            | Platform | Download |
            |----------|----------|
            | Windows (x86_64) | [⬇️ Download](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-windows-x86_64.zip) |
            | Linux (x86_64) | [⬇️ Download](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-linux-x86_64.zip) |
            | macOS (Intel) | [⬇️ Download](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-macos-intel.zip) |
            | macOS (Apple Silicon) | [⬇️ Download](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-macos-apple-silicon.zip) |
          files: |
            wdtt-client-windows-x86_64.zip
            wdtt-client-linux-x86_64.zip
            wdtt-client-macos-intel.zip
            wdtt-client-macos-apple-silicon.zip
            wdtt-client-all-platforms.zip
            wdtt-client-all-platforms.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Обновление LATEST.md (только ссылка)
  # ============================================================
  update-latest:
    name: Update LATEST.md
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="${{ needs.create-release.outputs.tag }}"
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Create LATEST.md with only link
        run: |
          REPO="${{ github.repository }}"
          LATEST_TAG="${{ steps.latest.outputs.tag }}"
          
          echo "https://github.com/${REPO}/releases/download/${LATEST_TAG}/" > LATEST.md

      - name: Commit and push LATEST.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST.md
          git commit -m "Update LATEST.md to latest release ${{ steps.latest.outputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:main || git push origin HEAD:master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
