name: Build and Release WDTT Client

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Windows
  # ============================================================
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, i686]
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            target: aarch64-pc-windows-msvc
          - arch: i686
            target: i686-pc-windows-msvc
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build (Release)
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdtt-client-windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/wdtt-rslib.exe

  # ============================================================
  # Linux
  # ============================================================
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armv7, i686]
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            gcc_package: ""
            binutils_package: ""
            cc: ""
            ar: ""
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            gcc_package: gcc-aarch64-linux-gnu
            binutils_package: binutils-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar
          - arch: armv7
            target: armv7-unknown-linux-gnueabihf
            gcc_package: gcc-arm-linux-gnueabihf
            binutils_package: binutils-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            ar: arm-linux-gnueabihf-ar
          - arch: i686
            target: i686-unknown-linux-gnu
            gcc_package: gcc-i686-linux-gnu
            binutils_package: binutils-i686-linux-gnu
            cc: i686-linux-gnu-gcc
            ar: i686-linux-gnu-ar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (if needed)
        if: matrix.gcc_package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.gcc_package }} ${{ matrix.binutils_package }}

      - name: Set up environment for cross-compilation (if needed)
        if: matrix.cc != ''
        run: |
          echo "CC_${{ matrix.target }}=${{ matrix.cc }}" >> $GITHUB_ENV
          echo "AR_${{ matrix.target }}=${{ matrix.ar }}" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdtt-client-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/wdtt-rslib

  # ============================================================
  # macOS
  # ============================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdtt-client-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/wdtt-rslib

  # ============================================================
  # Сборка всех артефактов в релиз
  # ============================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate version tag
        id: version
        run: |
          # Формат: YYYY.MM.DD.HH.MM
          TAG=$(date +'%Y.%m.%d.%H.%M')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=WDTT Client $TAG" >> $GITHUB_OUTPUT

      - name: Prepare release directory
        run: |
          mkdir -p release
          cp -r artifacts/* release/

      - name: Create archive with all binaries
        run: |
          cd release
          # Создаём архив со всеми бинарниками
          zip -r ../wdtt-client-all-platforms.zip .
          tar -czf ../wdtt-client-all-platforms.tar.gz .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## WDTT Client Release
            
            **Date:** $(date +'%Y-%m-%d %H:%M:%S')
            
            ### Downloads
            - [wdtt-client-all-platforms.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-all-platforms.zip)
            - [wdtt-client-all-platforms.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/wdtt-client-all-platforms.tar.gz)
            
            ### Included platforms:
            - Windows (x86_64, ARM64, i686)
            - Linux (x86_64, ARM64, ARMv7, i686)
            - macOS (x86_64, ARM64)
          files: |
            wdtt-client-all-platforms.zip
            wdtt-client-all-platforms.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Обновление LATEST.md
  # ============================================================
  update-latest:
    name: Update LATEST.md
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="${{ needs.create-release.outputs.tag }}"
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Create/Update LATEST.md
        run: |
          LATEST_TAG="${{ steps.latest.outputs.tag }}"
          REPO="${{ github.repository }}"
          
          echo "# WDTT Client Latest Release" > LATEST.md
          echo "" >> LATEST.md
          echo "**Latest version:** \`$LATEST_TAG\`" >> LATEST.md
          echo "" >> LATEST.md
          echo "## Download" >> LATEST.md
          echo "" >> LATEST.md
          echo "### All Platforms (Archive)" >> LATEST.md
          echo "" >> LATEST.md
          echo "- [📦 Download ZIP](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-all-platforms.zip)" >> LATEST.md
          echo "- [📦 Download TAR.GZ](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-all-platforms.tar.gz)" >> LATEST.md
          echo "" >> LATEST.md
          echo "### Individual Binaries" >> LATEST.md
          echo "" >> LATEST.md
          echo "| Platform | Architecture | Download |" >> LATEST.md
          echo "|----------|--------------|----------|" >> LATEST.md
          
          # Windows
          echo "| Windows | x86_64 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-windows-x86_64/wdtt-rslib.exe) |" >> LATEST.md
          echo "| Windows | ARM64 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-windows-aarch64/wdtt-rslib.exe) |" >> LATEST.md
          echo "| Windows | i686 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-windows-i686/wdtt-rslib.exe) |" >> LATEST.md
          
          # Linux
          echo "| Linux | x86_64 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-linux-x86_64/wdtt-rslib) |" >> LATEST.md
          echo "| Linux | ARM64 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-linux-aarch64/wdtt-rslib) |" >> LATEST.md
          echo "| Linux | ARMv7 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-linux-armv7/wdtt-rslib) |" >> LATEST.md
          echo "| Linux | i686 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-linux-i686/wdtt-rslib) |" >> LATEST.md
          
          # macOS
          echo "| macOS | x86_64 | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-macos-x86_64/wdtt-rslib) |" >> LATEST.md
          echo "| macOS | ARM64 (Apple Silicon) | [⬇️ Download](https://github.com/${REPO}/releases/download/${LATEST_TAG}/wdtt-client-macos-aarch64/wdtt-rslib) |" >> LATEST.md
          
          echo "" >> LATEST.md
          echo "---" >> LATEST.md
          echo "" >> LATEST.md
          echo "**Release date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> LATEST.md

      - name: Commit and push LATEST.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST.md
          git commit -m "Update LATEST.md to latest release ${{ steps.latest.outputs.tag }}" || echo "No changes to commit"
          git push origin HEAD:main || git push origin HEAD:master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
