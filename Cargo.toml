[package]
name = "wdtt-rslib"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "WDTToR — Rust client for WDTT (WireGuard over TURN/DTLS), backwards compatible with the WDTT server"
license = "LGPL-2.1"

[lib]
name = "wdtt_rslib"
path = "src/lib.rs"

[[bin]]
name = "wdtt-rslib"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
webrtc-dtls = "0.12"
# webrtc-dtls 0.12 works against webrtc-util 0.11; the modern turn crate
# (0.17) against webrtc-util 0.17. Both are used under distinct aliases so the
# two Conn traits can be implemented side by side. The ancient webrtc-turn
# 0.1.x is avoided on purpose: it drags in nix 0.8.1, which no longer compiles
# on macOS.
webrtc-util = "0.11"
webrtc-util-17 = { package = "webrtc-util", version = "0.17" }
turn = "0.17"
boringtun = "0.7"
async-trait = "0.1"
socket2 = "0.5"
libc = "0.2.191"
clap = { version = "4.5.61", features = ["derive"] }
