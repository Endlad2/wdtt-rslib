[package]
name = "wdtt-rslib"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the WDTT VK TURN client"

[lib]
name = "wdtt_rslib"
path = "src/lib.rs"

[[bin]]
name = "wdtt-rslib"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
hickory-resolver = "0.24"
log = "0.4"
async-trait = "0.1"
base64 = "0.22"                                    
chacha20poly1305 = "0.10"
hkdf = "0.12"
image = "0.25"                                    
rand = "0.8"
rayon = "1.10"
hex = "0.4"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4"] }
webrtc-dtls = "0.12"
webrtc-turn = "0.1.3"
webrtc-util = "0.11"
webrtc-util-legacy = { package = "webrtc-util", version = "0.1.22" }